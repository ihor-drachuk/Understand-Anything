name: Standalone bundle

on:
  push:
    branches: [standalone, 'standalone-*']
    tags: ['standalone-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # BUILD-INFO.json records this upstream commit, so we update it after every rebase.
  UPSTREAM_BASE: f2d0164f72fe678805c34245a6df36acededfebd

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install plugin dependencies
        working-directory: understand-anything-plugin
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build core, dashboard and viewer
        working-directory: understand-anything-plugin
        run: pnpm --filter understand-anything-viewer --fail-if-no-match build

      - name: Test core
        working-directory: understand-anything-plugin
        run: pnpm --filter @understand-anything/core --fail-if-no-match test

      - name: Assemble bundle
        run: node scripts/standalone/assemble.mjs . "$RUNNER_TEMP/bundle/understand-anything-plugin"

      - name: Pack bundle
        id: pack
        run: |
          version=$(node -p "require('./understand-anything-plugin/package.json').version")
          name="understand-anything-standalone-${version}-${GITHUB_SHA::7}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir dist-standalone
          tar -C "$RUNNER_TEMP/bundle" -czf "dist-standalone/$name.tar.gz" understand-anything-plugin
          (cd "$RUNNER_TEMP/bundle" && zip -qrX "$GITHUB_WORKSPACE/dist-standalone/$name.zip" understand-anything-plugin)
          (cd dist-standalone && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-bundle
          path: dist-standalone/
          if-no-files-found: error

  upstream-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: |
          pnpm --filter @understand-anything/core --fail-if-no-match build
          pnpm --filter @understand-anything/skill --fail-if-no-match build
          pnpm --filter understand-anything-viewer --fail-if-no-match build

      - name: Test
        run: pnpm test

      - name: Test Python scripts
        run: >
          python3 -m unittest
          tests.skill.understand.test_merge_batch_graphs
          tests.skill.understand.test_merge_subdomain_graphs
          tests.skill.knowledge.test_parse_knowledge_base -v

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/standalone

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-bundle
          path: dist-standalone

      - name: Verify and extract archive
        env:
          NAME: ${{ needs.build.outputs.name }}
        run: |
          cd dist-standalone
          if command -v sha256sum > /dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          mkdir "$RUNNER_TEMP/iso"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bd -o"$RUNNER_TEMP/iso" "$NAME.zip"
          else
            tar -C "$RUNNER_TEMP/iso" -xzf "$NAME.tar.gz"
          fi

      # On Linux we run the smoke test in a network namespace with only loopback, so a download attempt fails it.
      - name: Smoke test without network
        if: runner.os == 'Linux'
        run: >
          sudo unshare --net sh -c 'ip link set lo up &&
          exec sudo -u "$1" env PATH="$2" HOME="$3" node scripts/standalone/smoke.mjs "$4"'
          sh "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP/iso/understand-anything-plugin"

      - name: Smoke test
        if: runner.os != 'Linux'
        run: node scripts/standalone/smoke.mjs "$RUNNER_TEMP/iso/understand-anything-plugin"

  release:
    if: startsWith(github.ref, 'refs/tags/standalone-v')
    needs: [smoke, upstream-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-bundle
          path: dist-standalone

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-standalone/*.zip
            dist-standalone/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist-standalone/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes "Offline plugin bundle built from $GITHUB_SHA. Check it with SHA256SUMS and gh attestation verify."
